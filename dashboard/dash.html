<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dash.css">
</head>
<body>
    <div class="dashboard">

        <div class="header">
            <h2>My Dashboard</h2>
            <button onclick="logout()">Logout</button>
        </div>
        <div class="Welcome">
            <img src="../logo.jpeg" class="dashboard-logo">
            <div>
                <h1>Hello,<span id="name">Student</span>!</h1>
                <p>Welcome to my dashboard.</p>
            </div>
        </div>
        <div class="cards">
            <div class="card">
                <h3>My Profie</h3>
                <p>View account information.</p>
            </div>
            <div class="card">
                <h3>Student</h3>
                <p>This is the student dashboard.</p>
            </div>
            <div class="card">
                <h3>Status</h3>
                <p>Account is active.</p>
            </div>
        </div>

    </div>
    <script src="../script.js"></script>
    
</body>
</html>
